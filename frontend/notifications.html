<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Placement System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/placement-theme.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-graduation-cap"></i>
                Placement System
            </a>
            
            <div class="d-flex align-items-center">
                <div class="dropdown me-3">
                    <button class="btn btn-link text-white position-relative p-0" data-bs-toggle="dropdown">
                        <i class="fas fa-bell fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-secondary" 
                              id="notificationBadge" style="display: none;">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end" style="width: 320px;" id="notificationList">
                        <div class="text-center p-3">Loading...</div>
                    </div>
                </div>
                
                <div class="dropdown">
                    <button class="btn btn-link text-white text-decoration-none d-flex align-items-center" data-bs-toggle="dropdown">
                        <span class="me-2 d-none d-md-inline" id="userName">Student</span>
                        <i class="fas fa-user-circle fs-4"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="dashboard.html">Dashboard</a></li>
                        <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                        <li><a class="dropdown-item" href="applications.html">Applications</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-bell me-2 text-secondary"></i>Notifications</h2>
            <button class="btn btn-outline-secondary" onclick="markAllRead()">
                <i class="fas fa-check-double me-2"></i>Mark All Read
            </button>
        </div>
        
        <div class="card">
            <div class="card-body" id="notificationsList">
                <div class="text-center py-4">
                    <div class="spinner-border text-secondary"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        async function loadAllNotifications() {
            try {
                await loadUserInfo();
                
                const response = await fetch(`${API_BASE_URL}/notifications/my-notifications?limit=50`, {
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    const notifications = await response.json();
                    displayNotifications(notifications);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function displayNotifications(notifications) {
            const listDiv = document.getElementById('notificationsList');
            
            if (notifications.length === 0) {
                listDiv.innerHTML = '<p class="text-muted text-center">No notifications</p>';
                return;
            }
            
            let html = '';
            notifications.forEach(notif => {
                const bgClass = notif.is_read ? '' : 'bg-light';
                const icon = {
                    'info': 'info-circle text-info',
                    'success': 'check-circle text-success',
                    'warning': 'exclamation-triangle text-warning',
                    'danger': 'times-circle text-danger'
                }[notif.type] || 'bell text-secondary';
                
                html += `
                    <div class="p-3 ${bgClass} border-bottom" onclick="markRead(${notif.id})" style="cursor: pointer;">
                        <div class="d-flex">
                            <div class="me-3">
                                <i class="fas fa-${icon} fa-lg"></i>
                            </div>
                            <div class="flex-grow-1">
                                <h6 class="mb-1">${notif.title}</h6>
                                <p class="mb-1">${notif.message}</p>
                                <small class="text-muted">${new Date(notif.created_at).toLocaleString()}</small>
                            </div>
                            ${!notif.is_read ? '<span class="badge bg-secondary">New</span>' : ''}
                        </div>
                    </div>
                `;
            });
            
            listDiv.innerHTML = html;
        }
        
        async function markRead(id) {
            try {
                await fetch(`${API_BASE_URL}/notifications/mark-read/${id}`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });
                loadAllNotifications();
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function markAllRead() {
            try {
                await fetch(`${API_BASE_URL}/notifications/mark-all-read`, {
                    method: 'PUT',
                    headers: getAuthHeaders()
                });
                loadAllNotifications();
                showNotification('All notifications marked as read', 'success');
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        if (checkAuth()) {
            loadAllNotifications();
        }
    </script>
</body>
</html>
