<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Placement System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/placement-theme.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0A1929, #1A2A3A);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .reset-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 450px;
            margin: 0 auto;
        }
        .otp-input {
            width: 60px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            margin: 0 5px;
        }
        .otp-input:focus {
            border-color: #F0B90B;
            outline: none;
            box-shadow: 0 0 0 3px rgba(240,185,11,0.1);
        }
        .timer {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0A1929;
        }
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 5px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="reset-box">
                    <div class="text-center mb-4">
                        <i class="fas fa-key fa-3x text-secondary"></i>
                        <h3 class="mt-3">Reset Password</h3>
                        <p class="text-muted" id="emailDisplay">Enter OTP and new password</p>
                    </div>
                    
                    <div id="message"></div>
                    
                    <!-- Step 1: OTP Verification -->
                    <div id="otpSection">
                        <div class="text-center mb-4">
                            <div class="d-flex justify-content-center">
                                <input type="text" class="otp-input" id="otp1" maxlength="1" onkeyup="moveToNext(this, 'otp2')">
                                <input type="text" class="otp-input" id="otp2" maxlength="1" onkeyup="moveToNext(this, 'otp3')">
                                <input type="text" class="otp-input" id="otp3" maxlength="1" onkeyup="moveToNext(this, 'otp4')">
                                <input type="text" class="otp-input" id="otp4" maxlength="1" onkeyup="moveToNext(this, 'otp5')">
                                <input type="text" class="otp-input" id="otp5" maxlength="1" onkeyup="moveToNext(this, 'otp6')">
                                <input type="text" class="otp-input" id="otp6" maxlength="1">
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="timer" id="timer">10:00</span>
                            <button class="btn btn-link" id="resendBtn" onclick="resendOTP()" disabled>Resend OTP</button>
                        </div>
                        
                        <button class="btn btn-primary w-100" onclick="verifyOTP()">Verify OTP</button>
                    </div>
                    
                    <!-- Step 2: New Password (hidden initially) -->
                    <div id="passwordSection" style="display: none;">
                        <form id="resetForm">
                            <input type="hidden" id="resetToken" value="">
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control" id="password" required>
                                <div class="password-strength" id="strengthBar"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">
                                <span id="btnText">Reset Password</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                            </button>
                        </form>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="login.html" class="text-secondary">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // URL se email nikaalo
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || localStorage.getItem('resetEmail');
        
        if (email) {
            document.getElementById('emailDisplay').textContent = `Reset password for ${email}`;
            localStorage.setItem('resetEmail', email);
        } else {
            window.location.href = 'forgot-password.html';
        }
        
        // Timer variables
        let timeLeft = 600; // 10 minutes
        let timerInterval;
        
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('resendBtn').disabled = false;
                    document.getElementById('timer').textContent = '00:00';
                    showNotification('OTP expired. Please resend.', 'warning');
                }
            }, 1000);
        }
        
        startTimer();
        
        // Move to next input
        function moveToNext(current, nextId) {
            if (current.value.length >= 1) {
                document.getElementById(nextId)?.focus();
            }
        }
        
        // Get full OTP
        function getOTP() {
            return document.getElementById('otp1').value +
                   document.getElementById('otp2').value +
                   document.getElementById('otp3').value +
                   document.getElementById('otp4').value +
                   document.getElementById('otp5').value +
                   document.getElementById('otp6').value;
        }
        
        // Verify OTP
        async function verifyOTP() {
            const otp = getOTP();
            
            if (otp.length < 6) {
                showNotification('Please enter complete OTP', 'warning');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/otp/verify-reset-otp?email=${encodeURIComponent(email)}&otp=${otp}`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    clearInterval(timerInterval);
                    document.getElementById('resetToken').value = data.reset_token;
                    
                    // Show password section
                    document.getElementById('otpSection').style.display = 'none';
                    document.getElementById('passwordSection').style.display = 'block';
                    
                    showNotification('OTP verified! Enter new password', 'success');
                } else {
                    showNotification(data.detail || 'Invalid OTP', 'danger');
                }
            } catch (error) {
                showNotification('Network error', 'danger');
            }
        }
        
        // Resend OTP
        async function resendOTP() {
            const resendBtn = document.getElementById('resendBtn');
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Sending...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/otp/forgot-password?email=${encodeURIComponent(email)}`, {
                    method: 'POST'
                });
                
                if (response.ok) {
                    showNotification('New OTP sent!', 'success');
                    
                    // Reset timer
                    timeLeft = 600;
                    startTimer();
                    
                    // Clear OTP fields
                    for (let i = 1; i <= 6; i++) {
                        document.getElementById(`otp${i}`).value = '';
                    }
                    document.getElementById('otp1').focus();
                } else {
                    showNotification('Failed to resend OTP', 'danger');
                }
            } catch (error) {
                showNotification('Network error', 'danger');
            } finally {
                resendBtn.disabled = true;
                resendBtn.innerHTML = 'Resend OTP';
            }
        }
        
        // Password strength
        document.getElementById('password')?.addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            
            strengthBar.className = 'password-strength';
            if (password.length === 0) {
                strengthBar.style.width = '0';
            } else if (password.length < 6) {
                strengthBar.classList.add('bg-danger');
                strengthBar.style.width = '33.33%';
            } else if (password.length < 10) {
                strengthBar.classList.add('bg-warning');
                strengthBar.style.width = '66.66%';
            } else {
                strengthBar.classList.add('bg-success');
                strengthBar.style.width = '100%';
            }
        });
        
        // Reset password form submit
        document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        
        if (password !== confirm) {
            showNotification('Passwords do not match', 'danger');
            return;
        }
        
        if (password.length < 6) {
            showNotification('Password must be at least 6 characters', 'danger');
            return;
        }
        
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('btnSpinner');
        
        btn.disabled = true;
        btnText.classList.add('d-none');
        spinner.classList.remove('d-none');
        
        try {
            // ===== FIX: Reset token bhi send karo =====
            const resetToken = document.getElementById('resetToken').value;
            
            const response = await fetch(
                `${API_BASE_URL}/auth/reset-password?email=${encodeURIComponent(email)}&otp=${getOTP()}&new_password=${password}&reset_token=${resetToken}`, 
                {
                    method: 'POST'
                }
            );
            
            if (response.ok) {
                showNotification('Password reset successful! Redirecting to login...', 'success');
                localStorage.removeItem('resetEmail');
                
                setTimeout(() => {
                    window.location.href = `login.html?email=${encodeURIComponent(email)}`;
                }, 2000);
            } else {
                const data = await response.json();
                showNotification(data.detail || 'Failed to reset password', 'danger');
            }
        } catch (error) {
            showNotification('Network error', 'danger');
        } finally {
            btn.disabled = false;
            btnText.classList.remove('d-none');
            spinner.classList.add('d-none');
        }
    });
    </script>
</body>
</html>
