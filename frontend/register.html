<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Placement System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/placement-theme.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0A1929, #1A2A3A);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 0 auto;
        }
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 5px;
            transition: all 0.3s;
        }
        .strength-weak { background: #EB5757; width: 33.33%; }
        .strength-medium { background: #F2C94C; width: 66.66%; }
        .strength-strong { background: #27AE60; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="register-box">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-graduate fa-3x text-secondary"></i>
                        <h3 class="mt-3">Create Account</h3>
                        <p class="text-muted">Join the placement system today</p>
                    </div>
                    
                    <div id="message"></div>
                    
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                            <div class="password-strength" id="strengthBar"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-control" id="role">
                                <option value="student">Student</option>
                                <option value="admin">Admin (TPO)</option>
                            </select>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">I agree to the Terms & Conditions</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="registerBtn">
                            <span id="btnText">Register</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p>Already have an account? <a href="login.html" class="text-secondary">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
        
            strengthBar.className = 'password-strength';
            if (password.length === 0) {
                strengthBar.style.width = '0';
            } else if (password.length < 6) {
                strengthBar.classList.add('strength-weak');
            } else if (password.length < 10) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        });
    
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
        
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
        
            if (password !== confirm) {
                showNotification('Passwords do not match', 'danger');
                return;
            }
        
            const btn = document.getElementById('registerBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
        
            btn.disabled = true;
            btnText.classList.add('d-none');
            spinner.classList.remove('d-none');
        
            try {
                const response = await fetch('http://localhost:8000/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        full_name: document.getElementById('fullName').value,
                        email: document.getElementById('email').value,
                        password: password,
                        role: document.getElementById('role').value
                    })
                });
            
                const data = await response.json();
            
                if (response.ok) {
                // Save email for verification page
                    localStorage.setItem('pendingEmail', document.getElementById('email').value);
                
                    showNotification('Registration successful! Redirecting to email verification...', 'success');
                
                    setTimeout(() => {
                        window.location.href = `verify-otp.html?email=${encodeURIComponent(document.getElementById('email').value)}`;
                    }, 2000);
                } else {
                    showNotification(data.detail || 'Registration failed', 'danger');
                }
            } catch (error) {
                showNotification('Network error. Please try again.', 'danger');
            } finally {
                btn.disabled = false;
                btnText.classList.remove('d-none');
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
