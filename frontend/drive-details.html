<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Details | Placement System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/placement-theme.css">
    
    <style>
        body {
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        
        .drive-header {
            background: linear-gradient(135deg, #0A1929, #1A2A3A);
            color: white;
            padding: 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .company-badge {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        
        .eligibility-score {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .score-value {
            font-size: 3rem;
            font-weight: 700;
            color: #F0B90B;
            line-height: 1;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 500;
            display: inline-block;
        }
        
        .status-eligible {
            background: #27AE60;
            color: white;
        }
        
        .status-not-eligible {
            background: #EB5757;
            color: white;
        }
        
        .skill-tag {
            background: #E3F2FD;
            color: #0A1929;
            padding: 6px 14px;
            border-radius: 20px;
            margin: 4px;
            display: inline-block;
            font-size: 0.9rem;
            border: 1px solid #BBDEFB;
        }
        
        .skill-matched {
            background: #D4EDDA;
            color: #155724;
            border-color: #C3E6CB;
        }
        
        .skill-missing {
            background: #FFEBEE;
            color: #EB5757;
            border-color: #FFCDD2;
        }
        
        .recommendation-card {
            background: white;
            border-left: 4px solid #F0B90B;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #F0B90B;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        
        .info-label {
            font-size: 0.85rem;
            color: #64748B;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0A1929;
        }
        
        .btn-apply {
            background: #F0B90B;
            color: #0A1929;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            border: none;
            transition: all 0.3s;
        }
        
        .btn-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240,185,11,0.3);
        }
        
        .btn-apply:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-graduation-cap"></i>
                Placement System
            </a>
            
            <div class="d-flex align-items-center">
                <div class="dropdown me-3">
                    <button class="btn btn-link text-white position-relative p-0" data-bs-toggle="dropdown">
                        <i class="fas fa-bell fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-secondary" 
                              id="notificationBadge" style="display: none;">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end" style="width: 320px;" id="notificationList">
                        <div class="text-center p-3">Loading...</div>
                    </div>
                </div>
                
                <div class="dropdown">
                    <button class="btn btn-link text-white text-decoration-none d-flex align-items-center" data-bs-toggle="dropdown">
                        <span class="me-2 d-none d-md-inline" id="userName">Student</span>
                        <i class="fas fa-user-circle fs-4"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="dashboard.html">Dashboard</a></li>
                        <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                        <li><a class="dropdown-item" href="applications.html">Applications</a></li>
                        <li><a class="dropdown-item" href="drives.html">Drives</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div id="driveDetails" class="mb-4"></div>
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading drive details...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const driveId = urlParams.get('id');
        
        if (!driveId) {
            window.location.href = 'drives.html';
        }
        
        async function loadDriveDetails() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('driveDetails').innerHTML = '';
                
                const user = await loadUserInfo();
                
                // Get drive details with eligibility prediction
                const response = await fetch(`${API_BASE_URL}/ai/predict-eligibility/${driveId}`, {
                    headers: getAuthHeaders()
                });
                
                document.getElementById('loading').style.display = 'none';
                
                if (response.ok) {
                    const data = await response.json();
                    displayDriveDetails(data);
                } else {
                    document.getElementById('driveDetails').innerHTML = `
                        <div class="alert alert-danger">
                            Failed to load drive details. Please try again.
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('driveDetails').innerHTML = `
                    <div class="alert alert-danger">
                        Network error. Please check your connection.
                    </div>
                `;
            }
        }
        
        function displayDriveDetails(data) {
            const prediction = data.prediction;
            const analysis = data.skill_analysis;
    
    // Use the SAME eligibility logic as drives page
            const isEligible = prediction.eligible;  // This comes from backend with 70% rule
            const statusClass = isEligible ? 'status-eligible' : 'status-not-eligible';
            const statusText = isEligible ? '✅ Eligible' : '❌ Not Eligible';
            const probabilityPercent = Math.round(prediction.probability * 100);
    
    // Get skills data
            const matchedSkills = analysis.matched_skills || [];
            const missingSkills = analysis.missing_skills || [];
            const matchPercentage = analysis.match_percentage || 0;
    
    // Create skills HTML
            let matchedSkillsHtml = '';
            if (matchedSkills.length > 0) {
                matchedSkillsHtml = matchedSkills.map(skill => 
                    `<span class="skill-tag skill-matched">${skill}</span>`
                ).join('');
            } else {
                matchedSkillsHtml = '<p class="text-muted">No matched skills</p>';
            }
    
            let missingSkillsHtml = '';
            if (missingSkills.length > 0) {
                missingSkillsHtml = missingSkills.map(skill => 
                    `<span class="skill-tag skill-missing">${skill}</span>`
                ).join('');
            } else {
                missingSkillsHtml = '<p class="text-muted">No missing skills! Perfect match!</p>';
            }
    
    // Create recommendations HTML
            let recommendationsHtml = '';
            if (analysis.recommendations && analysis.recommendations.length > 0) {
                recommendationsHtml = analysis.recommendations.map(rec => `
                    <div class="recommendation-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${rec.skill}</strong>
                                <p class="mb-1 small">${rec.course} on ${rec.platform}</p>
                            </div>
                            <a href="${rec.url}" target="_blank" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-external-link-alt"></i> Start
                            </a>
                        </div>
                    </div>
                `).join('');
            } else {
                recommendationsHtml = '<p class="text-muted">No recommendations available</p>';
            }
    
    // Determine button based on eligibility
            let actionButton = '';
            if (data.already_applied) {
                actionButton = '<span class="badge badge-selected p-3">✓ Already Applied</span>';
            } else if (isEligible) {
                actionButton = `<button class="btn btn-apply" onclick="applyForDrive()">
                    <i class="fas fa-paper-plane me-2"></i>Apply Now
                </button>`;
            } else {
                actionButton = '<span class="badge badge-rejected p-3">❌ Not Eligible</span>';
            }
    
            const driveHtml = `
                <div class="drive-header">
                    <div class="company-badge">
                        <i class="fas fa-building me-2"></i>${data.company}
                    </div>
                    <h2 class="mb-3">${data.job_title}</h2>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Eligibility Score</div>
                            <div class="info-value">${probabilityPercent}%</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Status</div>
                            <div><span class="status-badge ${statusClass}">${statusText}</span></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Skill Match</div>
                            <div class="info-value">${matchPercentage}%</div>
                        </div>
                    </div>
            
                    <!-- Show CGPA comparison -->
                    <div class="mt-3 small text-white-50">
                        <i class="fas fa-star me-1"></i> CGPA Requirement: ${data.prediction.details?.cgpa_match ? '✅ Met' : '❌ Not Met'}
                    </div>
                </div>
        
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header bg-success text-white">
                                <i class="fas fa-check-circle me-2"></i>Matched Skills (${matchedSkills.length})
                            </div>
                            <div class="card-body">
                                ${matchedSkillsHtml}
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header bg-danger text-white">
                                <i class="fas fa-times-circle me-2"></i>Missing Skills (${missingSkills.length})
                            </div>
                            <div class="card-body">
                                ${missingSkillsHtml}
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-graduation-cap me-2"></i>Recommended Courses
                    </div>
                    <div class="card-body">
                        ${recommendationsHtml}
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="drives.html" class="btn btn-secondary me-2">
                        <i class="fas fa-arrow-left me-2"></i>Back to Drives
                    </a>
                    ${actionButton}
                </div>
            `;
    
            document.getElementById('driveDetails').innerHTML = driveHtml;
        }
        
        async function applyForDrive() {
            try {
                const response = await fetch(`${API_BASE_URL}/student/apply/${driveId}`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showNotification('Applied successfully!', 'success');
                    setTimeout(() => window.location.href = 'applications.html', 2000);
                } else {
                    showNotification('Error: ' + (data.detail || 'Application failed'), 'danger');
                }
            } catch (error) {
                showNotification('Network error', 'danger');
            }
        }
        
        if (checkAuth()) {
            loadDriveDetails();
        }
    </script>
</body>
</html>
